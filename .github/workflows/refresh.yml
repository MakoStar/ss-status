name: Refresh

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ss-status-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger worker refresh
        run: curl -fsS -X POST "https://ss-status.makostar.workers.dev/api/refresh"
